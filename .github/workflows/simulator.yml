# Simulator taktika: testovi. Izvršni fajl (exe) i GitHub Release se više ne prave: aplikacija se pokreće
# direktno iz kloniranog repoa (start.sh / start.bat), pa je uvek najnovija i deli taktike i profil kroz git.
name: Simulator

on:
  push:
    paths: ["simulator/**", "ESP32/lib/**", "ESP32/sim/**", "ESP32/tactics/**", "ESP32/config.py",
            "tools/espnet.py", ".github/workflows/simulator.yml"]
  pull_request:
    paths: ["simulator/**", "ESP32/lib/**", "ESP32/sim/**", "ESP32/tactics/**", "ESP32/config.py",
            "tools/espnet.py", ".github/workflows/simulator.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest -r simulator/requirements.txt
      - name: testovi simulatora
        run: python -m pytest -q simulator/tests
      - name: taktike iz ESP32/tactics se izvršavaju
        run: |
          python simulator/sim.py run primer --side zuta
          python simulator/sim.py run primer --side plava --test
          python simulator/sim.py run kamenolomi --side plava
