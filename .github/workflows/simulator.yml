# Simulator taktika: testovi i izvršni fajl (jedan fajl, bez instalacije).
#  - svaki push/PR koji dira simulator ili ESP kod: testovi + fajl kao "artifact" (Actions -> run -> Artifacts)
#  - tag sim-v* (npr. sim-v0.1): i GitHub Release sa fajlom (stalan link za skidanje)
name: Simulator

on:
  push:
    paths: ["simulator/**", "ESP32/lib/**", "ESP32/sim/**", "ESP32/tactics/**", "ESP32/config.py",
            "tools/espnet.py", ".github/workflows/simulator.yml"]
    branches: ["**"]                  # bez ovoga "tags" isključi push na grane
    tags: ["sim-v*"]
  pull_request:
    paths: ["simulator/**", "ESP32/lib/**", "ESP32/sim/**", "ESP32/tactics/**", "ESP32/config.py",
            "tools/espnet.py", ".github/workflows/simulator.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest -r simulator/requirements.txt
      - name: testovi simulatora
        run: python -m pytest -q simulator/tests
      - name: taktike iz ESP32/tactics se izvršavaju
        run: |
          python simulator/sim.py run primer --side plava
          python simulator/sim.py run primer --side zuta --test

  build:
    needs: test
    permissions:
      contents: write                 # za GitHub Release
    runs-on: ubuntu-22.04             # stariji glibc: fajl radi i na starijim distribucijama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1 -r simulator/requirements.txt
      - run: pyinstaller --noconfirm simulator/eurosim.spec
      - name: provera fajla (van repoa)
        run: |
          mkdir -p ../probe && cp dist/eurosim ../probe/ && cd ../probe
          EUROSIM_HOME=$PWD/home ./eurosim run primer --side zuta
      - uses: actions/upload-artifact@v4
        with:
          name: eurosim-linux
          path: dist/eurosim
      - name: GitHub Release (samo za tag sim-v*)
        if: startsWith(github.ref, 'refs/tags/sim-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/eurosim

  # Windows nije prioritet: samo ručno (Actions -> Simulator -> Run workflow) ili za tag sim-v*,
  # da ne pravi crvene runove na svaki push.
  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/sim-v')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1 -r simulator/requirements.txt
      - run: pyinstaller --noconfirm simulator/eurosim.spec
      - name: provera fajla (van repoa)
        shell: bash
        run: |
          mkdir -p ../probe && cp dist/eurosim.exe ../probe/ && cd ../probe
          EUROSIM_HOME=$PWD/home ./eurosim.exe run primer --side zuta
      - uses: actions/upload-artifact@v4
        with:
          name: eurosim-windows
          path: dist/eurosim.exe
      - name: GitHub Release (samo za tag sim-v*)
        if: startsWith(github.ref, 'refs/tags/sim-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/eurosim.exe
