# Simulator taktika: testovi, izvršni fajl (jedan fajl, bez instalacije) i GitHub Release.
#  - push na bilo koju granu / PR (simulator ili ESP kod): testovi + Linux fajl kao "artifact"
#  - push na main ili tag sim-v* (npr. sim-v0.1.0): testovi + Linux i Windows fajl + GitHub Release
#    (main: verzija sim-v0.2.<broj runa>, tag: ime taga). Releases uvek ima poslednji fajl za oba sistema.
#  - ručno (Actions -> Simulator -> Run workflow): i Windows fajl; ako se upiše "release" (npr. sim-v0.1.0),
#    i Release sa tim imenom (tag napravi GitHub, ne treba git push taga)
name: Simulator

on:
  push:
    paths: ["simulator/**", "ESP32/lib/**", "ESP32/sim/**", "ESP32/tactics/**", "ESP32/config.py",
            "tools/espnet.py", ".github/workflows/simulator.yml"]
    branches: ["**"]                  # bez ovoga "tags" isključi push na grane
    tags: ["sim-v*"]                  # (za tagove se "paths" ne gleda)
  pull_request:
    paths: ["simulator/**", "ESP32/lib/**", "ESP32/sim/**", "ESP32/tactics/**", "ESP32/config.py",
            "tools/espnet.py", ".github/workflows/simulator.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Ime verzije za GitHub Release (npr. sim-v0.1.0); prazno = samo fajlovi u Artifacts"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest -r simulator/requirements.txt
      - name: testovi simulatora
        run: python -m pytest -q simulator/tests
      - name: taktike iz ESP32/tactics se izvršavaju
        run: |
          python simulator/sim.py run primer --side zuta
          python simulator/sim.py run primer --side plava --test

  build-linux:
    needs: test
    runs-on: ubuntu-22.04             # stariji glibc: fajl radi i na starijim distribucijama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1 -r simulator/requirements.txt
      - run: pyinstaller --noconfirm simulator/eurosim.spec
      - name: provera fajla (van repoa)
        run: |
          mkdir -p ../probe && cp dist/eurosim ../probe/ && cd ../probe
          EUROSIM_HOME=$PWD/home ./eurosim run primer --side plava
      - uses: actions/upload-artifact@v4
        with:
          name: eurosim-linux
          path: dist/eurosim

  # Windows: za Release (main, tag) i ručno; ne na svaki push, da ne pravi crvene runove.
  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/sim-v')))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1 -r simulator/requirements.txt
      - run: pyinstaller --noconfirm simulator/eurosim.spec
      - name: provera fajla (van repoa)
        shell: bash
        run: |
          mkdir -p ../probe && cp dist/eurosim.exe ../probe/ && cd ../probe
          EUROSIM_HOME=$PWD/home ./eurosim.exe run primer --side plava
      - uses: actions/upload-artifact@v4
        with:
          name: eurosim-windows
          path: dist/eurosim.exe

  release:
    needs: [build-linux, build-windows]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/sim-v'))) || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: imena fajlova i verzija
        id: v
        env:
          IN_RELEASE: ${{ inputs.release }}
        run: |
          if [[ -n "$IN_RELEASE" ]]; then TAG="$IN_RELEASE"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"
          else TAG="sim-v0.2.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir out
          cp art/eurosim-linux/eurosim "out/eurosim-$TAG-linux"
          cp art/eurosim-windows/eurosim.exe "out/eurosim-$TAG-windows.exe"
          chmod +x out/*-linux
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Eurosim ${{ steps.v.outputs.tag }}
          make_latest: true
          body: |
            Simulator taktika (Robot-2027), jedan fajl bez instalacije.
            - Linux: `chmod +x eurosim-*-linux && ./eurosim-*-linux` (otvara browser)
            - Windows: dvoklik na `eurosim-*-windows.exe`
            Unutar repoa koristi taktike iz repoa, van njega `~/Eurosim`. Uputstvo: simulator/README.md.
            Commit: ${{ github.sha }}
          files: out/*
