name: protocol

on:
  push:
    branches: [main]
    paths: ["protocol/**", ".github/workflows/protocol.yml"]
  pull_request:
    paths: ["protocol/**", ".github/workflows/protocol.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build i testovi (host)
        run: |
          cmake -S protocol -B build/protocol -DCMAKE_BUILD_TYPE=Release
          cmake --build build/protocol
          ctest --test-dir build/protocol --output-on-failure
      - name: Provera za mikrokontrolere (bez izuzetaka i RTTI)
        run: |
          echo '#include "eurobot_protocol/protocol.hpp"' > /tmp/mcu.cpp
          g++ -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Wpedantic -Wconversion -Werror \
              -Iprotocol/include -c /tmp/mcu.cpp -o /tmp/mcu.o
