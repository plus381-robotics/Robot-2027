name: nucleo

on:
  push:
    branches: [main]
    paths: ["nucleo/**", "protocol/**", ".github/workflows/nucleo.yml"]
  pull_request:
    paths: ["nucleo/**", "protocol/**", ".github/workflows/nucleo.yml"]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Da li CubeMX projekat postoji
        id: check
        run: |
          if [ -f nucleo/firmware/CMakePresets.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "nucleo/firmware jos nije generisan, preskacem build."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: ARM toolchain
        if: steps.check.outputs.exists == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi ninja-build
      - name: Build (Release)
        if: steps.check.outputs.exists == 'true'
        working-directory: nucleo/firmware
        run: |
          cmake --preset Release
          cmake --build --preset Release
          arm-none-eabi-size build/Release/*.elf
      - name: Firmware kao artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-firmware-${{ github.sha }}
          path: nucleo/firmware/build/Release/*.elf
          retention-days: 30
