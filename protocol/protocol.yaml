# Jedini izvor istine za komunikaciju ESP32 <-> STM32 (BlackPill i Nucleo; i ESP32 -> laptop).
# dir: e2n = ESP32 -> STM32, n2e = STM32 -> ESP32, e2h = ESP32 -> laptop (host). ("n" = Nucleo, istorijski)
# Posle svake izmene:  python protocol/gen.py   i podigni `version`  (treba: pip install pyyaml).
#
# Okvir:  COBS( type:u8 | seq:u8 | payload | crc16:u16 ) 0x00
#   - little-endian, CRC16-CCITT (poly 0x1021, init 0xFFFF) nad type+seq+payload
#   - seq 1..255 za komande; 0 = nezatražena poruka (STATUS, LOG...)
#   - odgovori (ACK/DONE/FAIL) nose seq komande na koju se odnose
#
# Jedinice: mm, cdeg (stotinke stepena, -18000..18000), mm/s, mrad/s, ms.
# Tipovi polja: u8 i8 u16 i16 u32 i32 f32, i "bytes" (ostatak paketa, samo poslednje polje).

version: 4          # v3: STATUS.last_seq/last_result (ishod kretanja i kad se DONE/FAIL izgubi)
                    # v4: RESET, RESUME, STATUS.uptime_ms/w, PONG.reset_cause, Reason.LINK; bez debug poruka

enums:
  Reason:          # razlog u FAIL poruci
    INVALID: 1     # neispravni parametri / nepoznata komanda
    BLOCKED: 2     # video protivnika i robot je stao
    TIMEOUT: 3     # kretanje nije završeno na vreme
    PREEMPTED: 4   # nova komanda kretanja je prekinula ovu
    MATCH_OVER: 5  # isteklo 100 s, ništa se više ne izvršava
    STOPPED: 6     # prekinuto komandom STOP
    LINK: 7        # prekinuto jer nije bilo PING-a 500 ms (pad veze); od v4, ranije STOPPED
  GotoFlags:
    REVERSE: 1     # vozi unazad
    NO_THETA: 2    # ignoriši završni ugao
  State:           # bitovi u STATUS.state
    MOVING: 1
    BLOCKED: 2     # rezervisano: STM32 ga još ne postavlja (IR senzori na novom robotu)
    MATCH_RUNNING: 4
    MATCH_OVER: 8
    # 16 je bio LINK_LOST (nikad postavljen); pad veze se vidi kao last_result = LINK
  ResetCause:      # bitovi u PONG.reset_cause (RCC->CSR pri pokretanju STM32); 0 = nepoznato
    PIN: 1         # NRST (taster ili ESP)
    POWER: 2       # uključenje / pad napona (POR, BOR)
    SOFT: 4        # softverski (komanda RESET, bootloader)
    IWDG: 8        # watchdog
    WWDG: 16
    LOW_POWER: 32

messages:
  # ---------------- ESP32 -> Nucleo ---------------
  PING:          {type: 0x01, dir: e2n, fields: []}
  SET_POSE:      {type: 0x10, dir: e2n, fields: [[x, i16], [y, i16], [theta, i16]]}
  GOTO:          {type: 0x11, dir: e2n, fields: [[x, i16], [y, i16], [theta, i16], [flags, u8], [max_speed, u16]]}
  ROTATE:        {type: 0x12, dir: e2n, fields: [[theta, i16]]}
  MOVE:          {type: 0x13, dir: e2n, fields: [[dist, i16], [max_speed, u16]]}
  STOP:          {type: 0x1F, dir: e2n, fields: []}
  ACTUATOR:      {type: 0x20, dir: e2n, fields: [[id, u8], [value, i16]]}
  MATCH_START:   {type: 0x30, dir: e2n, fields: []}
  # Obnova posle restarta STM32 u meču, jednom porukom: poza + meč koji traje već elapsed_ms (od v4).
  # STM32 nastavlja svoj sat meča od elapsed_ms i sam staje na 100 s.
  RESUME:        {type: 0x32, dir: e2n, fields: [[x, i16], [y, i16], [theta, i16], [elapsed_ms, u32]]}
  ENTER_BOOTLOADER: {type: 0x40, dir: e2n, fields: []}   # posle ACK STM32 skače u ugrađeni bootloader (AN3155)
  RESET:         {type: 0x41, dir: e2n, fields: []}      # posle ACK softverski restart STM32 (od v4)

  # ---------------- Nucleo -> ESP32 ---------------
  PONG:          {type: 0x81, dir: n2e, fields: [[version, u8], [reset_cause, u8, 4]]}
  ACK:           {type: 0x90, dir: n2e, fields: []}
  DONE:          {type: 0x91, dir: n2e, fields: []}
  FAIL:          {type: 0x92, dir: n2e, fields: [[reason, u8]]}
  # last_seq: seq poslednje ZAVRŠENE komande kretanja (0 = nijedna od pokretanja);
  # last_result: njen ishod, 0 = DONE, inače Reason (kao FAIL). Od v3 (starija STATUS poruka je kraća).
  # uptime_ms: ms od pokretanja STM32 (manji nego u prethodnom STATUS-u = STM32 restartovan). w: mrad/s. Od v4.
  STATUS:        {type: 0xA0, dir: n2e, fields: [[x, i16], [y, i16], [theta, i16], [v, i16], [state, u8], [match_ms, u32],
                                                [last_seq, u8, 3], [last_result, u8, 3],
                                                [uptime_ms, u32, 4], [w, i16, 4]]}
  LOG:           {type: 0xF0, dir: n2e, fields: [[text, bytes]]}
